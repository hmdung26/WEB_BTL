services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salesmanagement-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  app:
    build: .
    container_name: salesmanagement-app
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=mssql;Database=SalesManagement;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      - "80:80"
    volumes:
      - uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  mssql_data:
  uploads:
